name: Build & Release Native Dimmer Clients

on:
  workflow_dispatch:
  push:
    branches:
      - releaseBranch

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      REPO_DIR: ${{ github.workspace }}\YBTopaz8\Dimmer-MAUI

    steps:
      # 1. CHECKOUT MAIN REPO INTO YBTopaz8/Dimmer-MAUI (MATCHES LOCAL repos\ LAYOUT)
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: YBTopaz8/Dimmer-MAUI

      # 2. CHECKOUT SIBLING DEPENDENCIES IN MATCHING RELATIVE LOCATIONS
      - name: Checkout Dependencies
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path "$ws\YBTopaz8" | Out-Null

          git clone --depth 1 https://github.com/YBTopaz8/Last.fm "$ws\YBTopaz8\Last.fm"
          git clone --depth 1 https://github.com/YBTopaz8/Material.Components.Maui "$ws\YBTopaz8\Material.Components.Maui"
          git clone --depth 1 https://github.com/YBTopaz8/MaterialColorUtilities "$ws\MaterialColorUtilities"

      # 3. VERIFY EXPECTED FILES & LOG TREE
      - name: Verify Dependency Paths & Log Layout
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $requiredFiles = @(
            "$ws\YBTopaz8\Dimmer-MAUI\Dimmer\Dimmer\Dimmer.csproj",
            "$ws\YBTopaz8\Dimmer-MAUI\ATL\ATL.csproj",
            "$ws\YBTopaz8\Last.fm\src\Hqub.Lastfm\Hqub.Lastfm.csproj",
            "$ws\YBTopaz8\Material.Components.Maui\Material.Components.Maui\Material.Components.Maui.csproj",
            "$ws\MaterialColorUtilities\MaterialColorUtilities\MaterialColorUtilities.csproj",
            "$ws\MaterialColorUtilities\MaterialColorUtilities.SourceGenerators\MaterialColorUtilities.SourceGenerators.csproj"
          )

          $missing = $false
          foreach ($file in $requiredFiles) {
            if (Test-Path $file) {
              Write-Host "[OK]      $file"
            } else {
              Write-Host "[MISSING] $file" -ForegroundColor Red
              $missing = $true
            }
          }

          # Warn if any committed *externals.props exists in repo (could override relative paths)
          $propsFiles = Get-ChildItem -Path $ws -Recurse -Filter "*externals.props" -ErrorAction SilentlyContinue
          if ($propsFiles) {
            Write-Warning "Found externals props files that may override paths:"
            $propsFiles | ForEach-Object { Write-Warning " -> $($_.FullName)"; Get-Content $_.FullName }
          }

          if ($missing) {
            Write-Error "One or more required project files are missing. Stopping build."
            exit 1
          }

      # 4. CACHE NUGET
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 5. DETECT VERSION
      - name: Detect Version
        id: version_logic
        working-directory: ${{ env.REPO_DIR }}
        shell: pwsh
        run: |
          $projectFile = Get-ChildItem -Recurse -Filter "Dimmer.csproj" | Select-Object -First 1
          [xml]$xml = Get-Content $projectFile.FullName
          $currentVersionStr = $xml.SelectSingleNode("//Version").InnerText.Trim()
          $newTag = "v$currentVersionStr"

          "NEW_TAG=$newTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IS_PRE=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          git fetch --tags --force
          $allTags = git tag --sort=-version:refname
          $validPattern = "^v?\d+(\.\d+)+$"
          $foundTag = $allTags | Where-Object { $_.Trim() -ne $newTag -and $_.Trim() -match $validPattern } | Select-Object -First 1

          if ($null -ne $foundTag) {
            "LATEST_TAG=$($foundTag.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "LATEST_TAG=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          Write-Host "Version detected: $newTag (previous tag: $foundTag)"

      # 6. GENERATE CHANGELOG
      - name: Generate Changelog
        working-directory: ${{ env.REPO_DIR }}
        shell: pwsh
        run: |
          $prevTag = $env:LATEST_TAG
          if ([string]::IsNullOrWhiteSpace($prevTag)) {
            $log = git log -n 10 --pretty=format:"- %s (%h)" --no-merges
          } else {
            $log = git log "$($prevTag)..HEAD" -n 10 --pretty=format:"- %s (%h)" --no-merges
          }

          $logString = if ($log -is [Array]) { $log -join "`n" } else { $log }

          if ([string]::IsNullOrWhiteSpace($logString)) {
            $fallback = git log -n 10 --pretty=format:"- %s (%h)" --no-merges
            $logString = if ($fallback -is [Array]) { $fallback -join "`n" } else { $fallback }
          }

          $content = "## Changes in $env:NEW_TAG`n`n$logString"
          Set-Content -Path "$env:GITHUB_WORKSPACE\release_notes.md" -Value $content -Encoding UTF8

          $eof = [System.Guid]::NewGuid().ToString("N")
          "ESCAPED_LOG<<$eof" | Out-File -FilePath $env:GITHUB_ENV -Append
          $logString | Out-File -FilePath $env:GITHUB_ENV -Append
          "$eof" | Out-File -FilePath $env:GITHUB_ENV -Append

      # 7. LOCATE PROJECT FILES
      - name: Locate Project Files
        working-directory: ${{ env.REPO_DIR }}
        shell: pwsh
        run: |
          $winui = Get-ChildItem -Recurse -Filter "Dimmer.WinUI.csproj" | Select-Object -First 1
          $droid = Get-ChildItem -Recurse -Filter "DimmerDroid.Droid.csproj" | Select-Object -First 1
          $core  = Get-ChildItem -Recurse -Filter "Dimmer.csproj" | Select-Object -First 1

          if (-not $winui) { Write-Error "Dimmer.WinUI.csproj not found!"; exit 1 }
          if (-not $droid) { Write-Error "DimmerDroid.Droid.csproj not found!"; exit 1 }
          if (-not $core)  { Write-Error "Dimmer.csproj not found!"; exit 1 }

          "PATH_WINUI=$($winui.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATH_DROID=$($droid.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATH_CORE=$($core.FullName)"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DIR_CORE=$($core.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Core:    $($core.FullName)"
          Write-Host "WinUI:   $($winui.FullName)"
          Write-Host "Android: $($droid.FullName)"

      # 8. CREATE APPSETTINGS.JSON
      - name: Create appsettings.json
        shell: pwsh
        run: |
          $targetPath = Join-Path "${{ env.DIR_CORE }}" "appsettings.json"
          Set-Content -Path $targetPath -Value '${{ secrets.appsettings }}' -Encoding UTF8
          Write-Host "Created appsettings.json at $targetPath"

      # 9. SETUP .NET & WORKLOADS
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Workloads
        run: dotnet workload install maui-android maui-windows

      # 10. DIAGNOSTIC: LOG EVALUATED MSBUILD REFERENCES BEFORE BUILDING
      - name: Log Evaluated References (Core / WinUI / Android)
        shell: pwsh
        run: |
          Write-Host "=== Dimmer.csproj (Windows TFM) ProjectReferences & External Props ==="
          dotnet msbuild "${{ env.PATH_CORE }}" `
            -p:Configuration=Release `
            -p:TargetFramework=net10.0-windows10.0.19041.0 `
            -getProperty:LastFmProjectPath `
            -getProperty:AtlProjectPath `
            -getProperty:MaterialProjectPath `
            -getItem:ProjectReference

          Write-Host "=== Checking for duplicate ATL or missing Material ==="
          $evalJson = dotnet msbuild "${{ env.PATH_CORE }}" `
            -p:Configuration=Release `
            -p:TargetFramework=net10.0-windows10.0.19041.0 `
            -getItem:ProjectReference | ConvertFrom-Json

          $refs = $evalJson.Items.ProjectReference | ForEach-Object { $_.FullPath }
          $atlCount = ($refs | Where-Object { $_ -match '[\\/]ATL\.csproj$' }).Count
          $matCount = ($refs | Where-Object { $_ -match 'Material\.Components\.Maui\.csproj$' }).Count

          Write-Host "Evaluated ATL refs: $atlCount | Material refs: $matCount"
          if ($atlCount -gt 1) {
            Write-Error "Duplicate ATL ProjectReference detected in Dimmer.csproj!"
            exit 1
          }
          if ($matCount -eq 0) {
            Write-Error "Material.Components.Maui.csproj is NOT referenced in Dimmer.csproj!"
            exit 1
          }
          foreach ($r in $refs) {
            if (-not (Test-Path $r)) {
              Write-Error "Broken ProjectReference path: $r"
              exit 1
            }
          }

      # 11. PRE-BUILD SOURCE GENERATOR (needed because MaterialColorUtilities has GeneratePackageOnBuild=true)
      - name: Build MaterialColorUtilities SourceGenerator
        run: >
          dotnet build
          "${{ github.workspace }}\MaterialColorUtilities\MaterialColorUtilities.SourceGenerators\MaterialColorUtilities.SourceGenerators.csproj"
          -c Release

      # 12. BUILD WINDOWS
      - name: Build Windows
        shell: pwsh
        run: |
          dotnet publish "${{ env.PATH_WINUI }}" `
            -f net10.0-windows10.0.19041.0 `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -p:WindowsPackageType=None `
            -p:GenerateAppxPackageOnBuild=false `
            -p:AppxPackageSigningEnabled=false `
            -o "${{ github.workspace }}\RawBuild\WinUI"

      # 13. ZIP WINDOWS
      - name: Zip Windows Build
        shell: pwsh
        run: |
          $artifactsDir = "${{ github.workspace }}\Artifacts"
          $zipPath = "$artifactsDir\Dimmer-Windows-Portable-${{ env.NEW_TAG }}.zip"
          New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null
          Compress-Archive -Path "${{ github.workspace }}\RawBuild\WinUI\*" -DestinationPath $zipPath -Force
          "WIN_SIZE=$((Get-Item $zipPath).Length)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 14. BUILD ANDROID
      - name: Build Android
        run: >
          dotnet publish "${{ env.PATH_DROID }}"
          -f net10.0-android
          -c Release
          -r android-arm64
          -p:AndroidPackageFormat=apk
          -o "${{ github.workspace }}\RawBuild\Android"

      - name: Get Android Size
        shell: pwsh
        run: |
          $apk = Get-ChildItem "${{ github.workspace }}\RawBuild\Android\*-Signed.apk" | Select-Object -First 1
          if ($apk) {
            "APK_SIZE=$($apk.Length)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "APK_SIZE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # 15. UPLOAD ARTIFACTS
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dimmer-Builds-${{ env.NEW_TAG }}
          path: |
            RawBuild/Android/*.apk
            Artifacts/Dimmer-Windows-Portable-${{ env.NEW_TAG }}.zip

      # 16. PUSH TAG & CREATE RELEASE
      - name: Push Tag & Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            RawBuild/Android/*.apk
            Artifacts/Dimmer-Windows-Portable-${{ env.NEW_TAG }}.zip

      # 17. NOTIFY PARSE SERVER
      - name: Notify Parse of New Update
        shell: pwsh
        env:
          PARSE_APP_ID: ${{ secrets.PARSE_APP_ID }}
          PARSE_MASTER_KEY: ${{ secrets.PARSE_MASTER_KEY }}
          PARSE_SERVER_URL: ${{ secrets.PARSE_SERVER_URL }}
        run: |
          $releaseUrl = "${{ github.server_url }}/${{ github.repository }}/releases/tag/$($env:NEW_TAG)"
          $aSize = "$([math]::Round($env:APK_SIZE / 1MB, 2)) MB"
          $wSize = "$([math]::Round($env:WIN_SIZE / 1MB, 2)) MB"

          $body = @{
            title        = "Dimmer $($env:NEW_TAG)"
            version      = "$($env:NEW_TAG)"
            notes        = "$($env:ESCAPED_LOG)"
            url          = $releaseUrl
            androidSize  = $aSize
            windowsSize  = $wSize
            isPreRelease = $false
          } | ConvertTo-Json

          $headers = @{
            "X-Parse-Application-Id" = $env:PARSE_APP_ID
            "X-Parse-Master-Key"     = $env:PARSE_MASTER_KEY
            "Content-Type"           = "application/json"
          }

          Invoke-RestMethod -Uri "$($env:PARSE_SERVER_URL)/functions/postAppUpdate" -Method Post -Headers $headers -Body $body

      # 18. NOTIFY DISCORD
      - name: Notify Discord
        if: always()
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_WEBHOOK) { exit 0 }
          $status = "${{ job.status }}"
          $color = if ($status -eq 'success') { 3066993 } else { 15158332 }
          $body = @{
            embeds = @(@{
              title       = "Dimmer Release: ${{ env.NEW_TAG }}"
              description = "Status: $status"
              color       = $color
              fields      = @(@{
                name  = "Release"
                value = "[View](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }})"
              })
            })
          } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $body
